<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1f16" rx="24"/>
  <g transform="translate(0, 20)">
    <!-- House Gable Roof & JDC+ Emblem -->
    <!-- Gable Roof Peak & Right Eave -->
    <path d="M250 55 L385 185 C390 190 387 200 378 200 H352 L250 102 L150 198 C145 203 138 203 133 198 L115 180 L250 55 Z" fill="#ffffff"/>
    
    <!-- 4-Pane Attic Window Grid in Peak -->
    <rect x="226" y="112" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="254" y="112" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="226" y="140" width="20" height="20" rx="3" fill="#ffffff"/>
    <rect x="254" y="140" width="20" height="20" rx="3" fill="#ffffff"/>

    <!-- Left Roof Swoop into Letter 'J' -->
    <path d="M125 185 C125 175 132 168 140 168 H146 V260 C146 295 125 320 85 320 C62 320 42 308 35 292 C32 285 35 278 42 276 C49 274 56 278 60 284 C65 292 73 296 85 296 C105 296 116 282 116 260 V192 H125 Z" fill="#ffffff"/>

    <!-- Letter 'D' -->
    <path d="M165 192 H212 C245 192 268 214 268 252 C268 290 245 312 212 312 H165 C158 312 153 307 153 300 V204 C153 197 158 192 165 192 Z M183 214 V290 H210 C230 290 245 275 245 252 C245 229 230 214 210 214 H183 Z" fill="#ffffff"/>

    <!-- Letter 'C' -->
    <path d="M345 214 C338 202 324 192 304 192 C272 192 250 218 250 252 C250 286 272 312 304 312 C324 312 338 302 345 290 C349 283 346 275 339 272 C332 269 324 272 320 278 C316 284 310 288 303 288 C287 288 274 273 274 252 C274 231 287 216 303 216 C310 216 316 220 320 226 C324 232 332 235 339 232 C346 229 349 221 345 214 Z" fill="#ffffff"/>

    <!-- Medical Cross '+' with Heartbeat Pulse on the right -->
    <g>
      <!-- Cross Base -->
      <path d="M370 205 H395 V235 H425 V265 H395 V295 H370 V265 H340 V235 H370 V205 Z" fill="#ffffff"/>
      <!-- Heartbeat ECG Pulse Wave Line -->
      <path d="M330 250 H362 L370 228 L380 272 L392 236 L400 258 L408 250 H438" fill="none" stroke="#0d1f16" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Typography: JANANI DIAGNOSTIC CENTER -->
    <text x="250" y="375" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5">JANANI DIAGNOSTIC CENTER</text>
    
    <!-- Subtitle: (Digital Diagnostic and Consultation Center) -->
    <text x="250" y="415" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.5">(Digital Diagnostic and Consultation Center)</text>
  </g>
</svg>
